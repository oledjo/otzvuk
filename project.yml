name: Otzvuk
options:
  bundleIdPrefix: com.oledjo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Otzvuk:
    type: application
    platform: iOS
    sources:
      - path: Otzvuk
        excludes:
          - Info.plist
    info:
      path: Otzvuk/Info.plist
      properties:
        CFBundleDisplayName: Otzvuk
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записывать ваши аффирмации.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oledjo.otzvuk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  OtzvukTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OtzvukTests]
    dependencies:
      - target: Otzvuk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oledjo.otzvuk.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Otzvuk:
    build:
      targets:
        Otzvuk: all
    test:
      targets: [OtzvukTests]
    run:
      config: Debug
